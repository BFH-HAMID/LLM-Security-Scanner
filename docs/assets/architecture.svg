<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="550" viewBox="0 0 1280 550" role="img" aria-labelledby="title desc">
  <title id="title">LLM Security Scanner architecture</title>
  <desc id="desc">Attack probes and mutators pass through a target connector and layered detectors to produce scored findings and CI reports, protected by scope and rate-limit controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0eaa87"/>
      <stop offset="1" stop-color="#087b79"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1b3150" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#9aabc0"/>
    </marker>
  </defs>
  <rect width="1280" height="550" rx="28" fill="url(#bg)"/>
  <circle cx="1218" cy="24" r="136" fill="#d8f5ed" opacity=".42"/>
  <circle cx="26" cy="520" r="165" fill="#e0eaff" opacity=".58"/>

  <text x="54" y="55" fill="#07856f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">LLMSCAN · SECURITY PIPELINE</text>
  <text x="54" y="99" fill="#102137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="31" font-weight="750">From attack payload to actionable finding</text>
  <text x="54" y="128" fill="#61748b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">A reproducible, scope-aware scan. Tool calls are recorded — never executed.</text>

  <!-- flow connectors -->
  <path d="M320 276H344" stroke="#a7b7ca" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M621 276H645" stroke="#a7b7ca" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M922 276H946" stroke="#a7b7ca" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- stage cards -->
  <g filter="url(#shadow)">
    <rect x="48" y="165" width="272" height="230" rx="20" fill="#ffffff" stroke="#e0e8f1"/>
    <rect x="349" y="165" width="272" height="230" rx="20" fill="#ffffff" stroke="#e0e8f1"/>
    <rect x="650" y="165" width="272" height="230" rx="20" fill="#ffffff" stroke="#e0e8f1"/>
    <rect x="951" y="165" width="272" height="230" rx="20" fill="#ffffff" stroke="#e0e8f1"/>
  </g>

  <!-- stage one -->
  <circle cx="82" cy="204" r="18" fill="#e8faf5"/>
  <path d="M75 204h14M82 197v14M77 199l10 10M87 199l-10 10" stroke="#07977c" stroke-width="1.8" stroke-linecap="round"/>
  <text x="111" y="209" fill="#087f6e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">01 · ATTACK</text>
  <text x="70" y="252" fill="#14263c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Probe library</text>
  <text x="70" y="278" fill="#65768b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">88 YAML probes · 7 categories</text>
  <rect x="70" y="301" width="226" height="1" fill="#edf1f6"/>
  <text x="70" y="328" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Injection · jailbreak · leakage</text>
  <text x="70" y="352" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">RAG · output · excessive agency</text>
  <rect x="70" y="366" width="74" height="18" rx="9" fill="#eef8f5"/>
  <text x="107" y="379" text-anchor="middle" fill="#087f6e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">MUTATORS</text>

  <!-- stage two -->
  <circle cx="383" cy="204" r="18" fill="#edf3ff"/>
  <path d="M374 199h18v13h-18zM378 195h10M383 212v4M379 216h8" fill="none" stroke="#5574dc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="412" y="209" fill="#536fd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">02 · CONNECT</text>
  <text x="371" y="252" fill="#14263c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Your AI app</text>
  <text x="371" y="278" fill="#65768b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">One connector interface</text>
  <rect x="371" y="301" width="226" height="1" fill="#edf1f6"/>
  <text x="371" y="328" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">HTTP · OpenAI-compatible</text>
  <text x="371" y="352" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Anthropic · Ollama · agents</text>
  <rect x="371" y="366" width="99" height="18" rx="9" fill="#eff3ff"/>
  <text x="420" y="379" text-anchor="middle" fill="#536fd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">RAG-AWARE</text>

  <!-- stage three -->
  <circle cx="684" cy="204" r="18" fill="#fff4e7"/>
  <path d="M678 203l4 4 8-9M677 196h14M677 212h14" fill="none" stroke="#d9892d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="713" y="209" fill="#c47b24" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">03 · DETECT</text>
  <text x="672" y="252" fill="#14263c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Judge the evidence</text>
  <text x="672" y="278" fill="#65768b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Three complementary layers</text>
  <rect x="672" y="301" width="226" height="1" fill="#edf1f6"/>
  <text x="672" y="328" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Rules · canary tokens</text>
  <text x="672" y="352" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Strict-rubric LLM-as-judge</text>
  <rect x="672" y="366" width="80" height="18" rx="9" fill="#fff5e8"/>
  <text x="712" y="379" text-anchor="middle" fill="#b86c12" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">EVIDENCE</text>

  <!-- stage four -->
  <circle cx="985" cy="204" r="18" fill="#f1edff"/>
  <path d="M978 214v-8M985 214v-15M992 214v-11" stroke="#7859d5" stroke-width="2.2" stroke-linecap="round"/>
  <text x="1014" y="209" fill="#7659cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">04 · REPORT</text>
  <text x="973" y="252" fill="#14263c" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700">Fix what matters</text>
  <text x="973" y="278" fill="#65768b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Score · evidence · remediation</text>
  <rect x="973" y="301" width="226" height="1" fill="#edf1f6"/>
  <text x="973" y="328" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">JSON · HTML · PDF · SARIF</text>
  <text x="973" y="352" fill="#394c62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">CI gates · regression baselines</text>
  <rect x="973" y="366" width="64" height="18" rx="9" fill="#f1edff"/>
  <text x="1005" y="379" text-anchor="middle" fill="#7659cf" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700">SARIF</text>

  <!-- guardrail footer -->
  <rect x="48" y="423" width="1175" height="75" rx="18" fill="#e7f7f3" stroke="#d0eee6"/>
  <path d="M80 445l15-6 15 6v12c0 10-7 17-15 20-8-3-15-10-15-20z" fill="url(#accent)"/>
  <path d="M88 457l5 5 9-11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="127" y="456" fill="#145a50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Scope &amp; safety controls at every stage</text>
  <text x="127" y="480" fill="#55766f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Authorization gate</text>
  <circle cx="247" cy="476" r="2.2" fill="#83b7aa"/>
  <text x="261" y="480" fill="#55766f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Rate limits</text>
  <circle cx="342" cy="476" r="2.2" fill="#83b7aa"/>
  <text x="356" y="480" fill="#55766f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">SSRF controls</text>
  <circle cx="457" cy="476" r="2.2" fill="#83b7aa"/>
  <text x="471" y="480" fill="#55766f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Sensitive-data redaction</text>
  <text x="1193" y="466" text-anchor="end" fill="#07856f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">AUTHORIZED TESTING ONLY</text>

  <text x="54" y="530" fill="#8999ac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">CLI + Dashboard  ·  FastAPI  ·  Celery / Redis  ·  PostgreSQL</text>
  <text x="1224" y="530" text-anchor="end" fill="#8999ac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">OWASP LLM Top 10  ·  MITRE ATLAS</text>
</svg>
