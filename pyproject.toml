[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-security-scanner"
version = "0.1.0"
description = "Scan chat endpoints, RAG apps and agents for LLM vulnerabilities (OWASP LLM Top 10 / MITRE ATLAS) and get a scored report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "NXR HAMID" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "owasp", "mitre-atlas", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "reportlab>=4.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# FastAPI backend (also used by the vulnerable demo targets)
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# Celery + Redis job queue for the API
celery = ["celery[redis]>=5.4"]
# PostgreSQL driver
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "jsonschema>=4.22",
    "types-PyYAML",
]
all = ["llm-security-scanner[server,celery,postgres]"]

[project.urls]
Homepage = "https://github.com/BFH-HAMID/LLM-Security-Scanner"
Issues = "https://github.com/BFH-HAMID/LLM-Security-Scanner/issues"

[project.scripts]
llmscan = "scanner.cli:main"

[tool.setuptools]
# `probes/` lives at the repository root (YAML by category). It is shipped inside the wheel as the
# importable data package `scanner_probes` so `pip install` users get the built-in library too.
packages = [
    "scanner",
    "scanner.connectors",
    "scanner.mutators",
    "scanner.detectors",
    "scanner.multiturn",
    "scanner.reporting",
    "scanner.storage",
    "api",
    "api.routers",
    "api.jobs",
    "targets",
    "targets.vulnerable_app",
    "scanner_probes",
]

[tool.setuptools.package-dir]
scanner_probes = "probes"

[tool.setuptools.package-data]
scanner = ["reporting/templates/*.j2", "data/*"]
scanner_probes = ["*/*.yaml", "*.json"]

# ------------------------------------------------------------------ tooling
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs external services (Redis / PostgreSQL) — skipped when unavailable",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*", "ignore::DeprecationWarning:kombu.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dashboard", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # long lines are fine inside probe payload tables
    "RUF001",  # ambiguous unicode chars are intentional (homoglyph mutators)
    "RUF002",
    "RUF003",
    "B008",    # FastAPI Depends() in defaults
    "SIM105",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF015"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["dashboard/", "tests/"]
