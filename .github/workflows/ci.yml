name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # weekly: catches base-image and dependency drift

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy scanner api targets

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llmscan
          POSTGRES_PASSWORD: llmscan
          POSTGRES_DB: llmscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llmscan" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      TEST_POSTGRES_URL: postgresql://llmscan:llmscan@localhost:5432/llmscan_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[all,dev]"
      - run: pytest --cov=scanner --cov=api --cov=targets --cov-report=term-missing --cov-report=xml
      - name: Build the wheel and check it ships the probe library and report template
        if: matrix.python-version == '3.11'
        run: |
          pip wheel . --no-deps -w dist -q
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          probes = [n for n in names if n.startswith("scanner_probes/") and n.endswith(".yaml")]
          assert len(probes) >= 80, f"only {len(probes)} probe files in the wheel"
          assert "scanner/reporting/templates/report.html.j2" in names, "report template missing"
          print(f"wheel ok: {len(probes)} probes")
          PY
      - uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage
          path: coverage.xml

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  self-scan:
    name: Self scan (dogfooding the action)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@v7
      # The hardened demo app must never get worse than the committed baseline, and must never
      # leak to a critical attack. This is the same gate you would put on your own app.
      - uses: ./
        with:
          target: demo:hardened
          seed: "1"
          fail-on: critical
          baseline: .llmscan/baseline.json
          fail-on-regression: "true"
          sarif-category: llmscan-self-scan
          # Only pushes to the default branch may write code-scanning alerts.
          upload-sarif: ${{ github.event_name == 'push' && 'true' || 'false' }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate the compose file
        run: |
          sh scripts/init-env.sh
          docker compose config --quiet
          docker compose --profile ollama config --quiet
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: llmscan-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: dashboard
          push: false
          tags: llmscan-dashboard:ci
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard

  compose-smoke:
    name: Compose stack smoke test
    # Boots the real stack (Postgres, Redis, API, Celery worker, dashboard) and scans through it.
    # It is the only end-to-end check of the Compose deliverable, so it runs on pull requests too.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          sh scripts/init-env.sh
          docker compose up -d --build --wait --wait-timeout 600
      - name: Scan through the queue and read the result back
        run: |
          set -o pipefail
          python3 scripts/smoke_compose.py --key "$(grep '^LLMSCAN_API_KEY=' .env | cut -d= -f2)" --expect-queue celery 2>&1 | tee smoke.log
      - name: Failure details as annotations (readable without downloading logs)
        if: failure()
        run: |
          { echo "smoke script:"; tail -n 8 smoke.log 2>/dev/null; docker compose ps --format '{{.Service}}: {{.Status}}'; } \
            | sed 's/^/::error::/' | head -n 9
          for svc in api worker; do
            docker compose logs --no-color --tail=6 "$svc" 2>&1 | sed "s/^/::warning::[$svc] /" | head -n 8
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
